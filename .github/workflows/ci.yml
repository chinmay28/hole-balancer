name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Validate the example config
        run: |
          go run ./cmd/hole-balancer -validate -config config.example.yaml

      # Two ways in, both have to work: from inside a checkout, and piped from
      # curl into a bare shell with nothing on disk.
      - name: Quick start, in-tree
        run: |
          PORT=5399 ADMIN_PORT=8099 timeout 120 ./quickstart.sh 127.0.0.1:5301 &
          qs=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8099/api/overview >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/ | grep -q "hole-balancer"
          curl -sf http://127.0.0.1:8099/api/stats >/dev/null
          test ! -d hole-balancer   # must not clone when already in the tree
          kill $qs 2>/dev/null || true

      - name: Quick start, piped from a bare shell
        run: |
          mkdir -p /tmp/bare && cd /tmp/bare
          cat "$GITHUB_WORKSPACE/quickstart.sh" |             REPO_URL="file://$GITHUB_WORKSPACE" BRANCH=             PORT=5398 ADMIN_PORT=8098 timeout 120 bash -s -- 127.0.0.1:5301 &
          qs=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8098/api/overview >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8098/ | grep -q "hole-balancer"
          test -f /tmp/bare/hole-balancer/config.yaml   # it bootstrapped itself
          kill $qs 2>/dev/null || true

      - name: Quick start help works when piped
        run: cat quickstart.sh | bash -s -- --help | grep -q -- --install

      - name: Build
        run: go build ./...

      - name: Install script stages cleanly and never clobbers a config
        run: |
          make build
          DESTDIR=/tmp/stage ./deploy/install.sh
          test -x /tmp/stage/usr/local/bin/hole-balancer
          test -f /tmp/stage/etc/systemd/system/hole-balancer.service
          test -f /tmp/stage/etc/hole-balancer/config.yaml
          # The config must survive a second run: upgrading must not discard it.
          echo "# sentinel" >> /tmp/stage/etc/hole-balancer/config.yaml
          DESTDIR=/tmp/stage ./deploy/install.sh
          grep -q "# sentinel" /tmp/stage/etc/hole-balancer/config.yaml
          # The unit must keep the one writable path the dashboard needs.
          grep -q "ReadWritePaths=/etc/hole-balancer" /tmp/stage/etc/systemd/system/hole-balancer.service

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/hole-balancer

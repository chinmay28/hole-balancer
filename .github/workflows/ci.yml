name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Validate the example config
        run: |
          go run ./cmd/hole-balancer -validate -config config.example.yaml

      - name: Quick start builds and produces a valid config
        run: |
          PORT=5399 ADMIN_PORT=8099 timeout 90 ./quickstart.sh 127.0.0.1:5301 &
          qs=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8099/api/overview >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/ | grep -q "hole-balancer"
          curl -sf http://127.0.0.1:8099/api/stats >/dev/null
          kill $qs 2>/dev/null || true

      - name: Build
        run: go build ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/hole-balancer
